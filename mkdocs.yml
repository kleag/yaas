site_name: Yaas
site_description: Yet Another Audio Splitter — split YouTube video soundtracks into separate stems
site_url: https://kleag.github.io/yaas/
repo_url: https://github.com/kleag/yaas
repo_name: kleag/yaas
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - content.action.edit

nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  - Building & Releasing: building.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
