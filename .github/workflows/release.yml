name: Build and Release

on:
  push:
    tags:
      - '*.*.*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup FFMPEG
        uses: FedericoCarboni/setup-ffmpeg@v3
        id: setup-ffmpeg
        with:
          ffmpeg-version: release
          github-token: ${{ github.server_url == 'https://github.com' && github.token || '' }}

      - name: Set up Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Bundle uv binary for the in-app GPU-acceleration feature
        # Copies the uv binary this job just installed into ./bundled_uv/,
        # where yaas.spec picks it up and bundles it into the frozen app
        # (see src/yaas/gpu_env.py) -- no separate download needed.
        run: |
          New-Item -ItemType Directory -Force -Path bundled_uv | Out-Null
          Copy-Item (Get-Command uv).Source bundled_uv\uv.exe

      - name: Install dependencies
        # Installs the CPU-only build of torch (see [tool.uv.sources] in
        # pyproject.toml): the CUDA-enabled default PyPI build alone pushes
        # the frozen installer well past GitHub Releases' 2GB asset limit.
        run: uv pip install --system .

      - name: Install pyinstaller
        run: uv pip install --system pyinstaller

      - name: Build executable with pyinstaller
        run: pyinstaller yaas.spec

      - name: Build Installer
        run: |
            &"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" inno_setup_script.iss

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: yaas_installer_windows
          path: yaas_installer.exe

  build-macos-arm64:
    # macos-latest is Apple Silicon (arm64). PyInstaller doesn't
    # cross-compile -- it builds a native binary for whatever architecture
    # it runs on -- so an arm64-only .dmg here needs a separate x86_64 job
    # (below) on an Intel runner to also support Intel Macs. A single
    # "universal2" build isn't realistic: it needs every dependency to ship
    # universal2 wheels too, and this app's heavy CPU-only torch/onnxruntime
    # stack doesn't.
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        # Installs the CPU-only build of torch (see [tool.uv.sources] in
        # pyproject.toml): the CUDA-enabled default PyPI build alone pushes
        # the frozen installer well past GitHub Releases' 2GB asset limit.
        run: uv pip install --system .

      - name: Install pyinstaller
        run: uv pip install --system pyinstaller

      - name: Build app bundle with pyinstaller
        run: pyinstaller yaas.spec

      - name: Build DMG
        run: |
          hdiutil create -volname Yaas -srcfolder dist/yaas.app -ov -format UDZO yaas_installer_arm64.dmg

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: yaas_installer_macos_arm64
          path: yaas_installer_arm64.dmg

  build-macos-x86_64:
    # macos-13 is the last GitHub-hosted Intel Mac runner (macos-14+ are all
    # arm64). Not a permanent guarantee -- GitHub/Apple are winding down
    # Intel runner support over time -- but it's the only way to get a
    # native x86_64 build today. See build-macos-arm64 above for why this
    # is a separate job rather than one universal2 build.
    runs-on: macos-13

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        # Installs the CPU-only build of torch (see [tool.uv.sources] in
        # pyproject.toml): the CUDA-enabled default PyPI build alone pushes
        # the frozen installer well past GitHub Releases' 2GB asset limit.
        run: uv pip install --system .

      - name: Install pyinstaller
        run: uv pip install --system pyinstaller

      - name: Build app bundle with pyinstaller
        run: pyinstaller yaas.spec

      - name: Build DMG
        run: |
          hdiutil create -volname Yaas -srcfolder dist/yaas.app -ov -format UDZO yaas_installer_x86_64.dmg

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: yaas_installer_macos_x86_64
          path: yaas_installer_x86_64.dmg

  build-linux-appimage:
    runs-on: ubuntu-latest
    # AppImage packaging for a PySide6/WebEngine app is the least battle
    # tested of the three targets; don't let it block the Windows/macOS
    # installers or the PyPI publish if it breaks.
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Bundle uv binary for the in-app GPU-acceleration feature
        # Copies the uv binary this job just installed into ./bundled_uv/,
        # where yaas.spec picks it up and bundles it into the frozen app
        # (see src/yaas/gpu_env.py) -- no separate download needed.
        run: |
          set -e
          mkdir -p bundled_uv
          cp "$(command -v uv)" bundled_uv/uv
          chmod +x bundled_uv/uv

      - name: Install dependencies
        # Installs the CPU-only build of torch (see [tool.uv.sources] in
        # pyproject.toml): the CUDA-enabled default PyPI build alone pushes
        # the frozen installer well past GitHub Releases' 2GB asset limit.
        run: uv pip install --system .

      - name: Install pyinstaller
        run: uv pip install --system pyinstaller

      - name: Build executable with pyinstaller
        run: pyinstaller yaas.spec

      - name: Assemble AppDir
        run: |
          set -e
          mkdir -p AppDir/usr/bin
          cp dist/yaas AppDir/usr/bin/yaas
          chmod +x AppDir/usr/bin/yaas

          cat > AppDir/yaas.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Yaas
          Exec=yaas
          Icon=yaas
          Categories=AudioVideo;Audio;
          EOF

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/yaas" "$@"
          EOF
          chmod +x AppDir/AppRun

          cp src/yaas/resources/icon.png AppDir/yaas.png

      - name: Build AppImage
        run: |
          set -e
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run AppDir yaas-x86_64.AppImage

      - name: Upload AppImage as artifact
        uses: actions/upload-artifact@v4
        with:
          name: yaas_installer_linux
          path: yaas-x86_64.AppImage

  release:
    needs: [build-windows, build-macos-arm64, build-macos-x86_64, build-linux-appimage]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*/*
