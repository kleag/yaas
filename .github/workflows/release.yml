name: Build and Release

on:
  push:
    tags:
      - '*.*.*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup FFMPEG
        uses: FedericoCarboni/setup-ffmpeg@v3
        id: setup-ffmpeg
        with:
          ffmpeg-version: release
          github-token: ${{ github.server_url == 'https://github.com' && github.token || '' }}

      - name: Set up Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Bundle uv binary for the in-app GPU-acceleration feature
        # Copies the uv binary this job just installed into ./bundled_uv/,
        # where yaas.spec picks it up and bundles it into the frozen app
        # (see src/yaas/gpu_env.py) -- no separate download needed.
        run: |
          New-Item -ItemType Directory -Force -Path bundled_uv | Out-Null
          Copy-Item (Get-Command uv).Source bundled_uv\uv.exe

      - name: Install dependencies
        # Installs the CPU-only build of torch (see [tool.uv.sources] in
        # pyproject.toml): the CUDA-enabled default PyPI build alone pushes
        # the frozen installer well past GitHub Releases' 2GB asset limit.
        run: uv pip install --system .

      - name: Install pyinstaller
        run: uv pip install --system pyinstaller

      - name: Build executable with pyinstaller
        run: pyinstaller yaas.spec

      - name: Build Installer
        run: |
            &"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" inno_setup_script.iss

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: yaas_installer_windows
          path: yaas_installer.exe

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        # Installs the CPU-only build of torch (see [tool.uv.sources] in
        # pyproject.toml): the CUDA-enabled default PyPI build alone pushes
        # the frozen installer well past GitHub Releases' 2GB asset limit.
        run: uv pip install --system .

      - name: Install pyinstaller
        run: uv pip install --system pyinstaller

      - name: Build app bundle with pyinstaller
        run: pyinstaller yaas.spec

      - name: Build DMG
        run: |
          hdiutil create -volname Yaas -srcfolder dist/yaas.app -ov -format UDZO yaas_installer.dmg

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: yaas_installer_macos
          path: yaas_installer.dmg

  build-linux-appimage:
    runs-on: ubuntu-latest
    # AppImage packaging for a PySide6/WebEngine app is the least battle
    # tested of the three targets; don't let it block the Windows/macOS
    # installers or the PyPI publish if it breaks.
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Bundle uv binary for the in-app GPU-acceleration feature
        # Copies the uv binary this job just installed into ./bundled_uv/,
        # where yaas.spec picks it up and bundles it into the frozen app
        # (see src/yaas/gpu_env.py) -- no separate download needed.
        run: |
          set -e
          mkdir -p bundled_uv
          cp "$(command -v uv)" bundled_uv/uv
          chmod +x bundled_uv/uv

      - name: Install dependencies
        # Installs the CPU-only build of torch (see [tool.uv.sources] in
        # pyproject.toml): the CUDA-enabled default PyPI build alone pushes
        # the frozen installer well past GitHub Releases' 2GB asset limit.
        run: uv pip install --system .

      - name: Install pyinstaller
        run: uv pip install --system pyinstaller

      - name: Build executable with pyinstaller
        run: pyinstaller yaas.spec

      - name: Assemble AppDir
        run: |
          set -e
          mkdir -p AppDir/usr/bin
          cp dist/yaas AppDir/usr/bin/yaas
          chmod +x AppDir/usr/bin/yaas

          cat > AppDir/yaas.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Yaas
          Exec=yaas
          Icon=yaas
          Categories=AudioVideo;Audio;
          EOF

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/yaas" "$@"
          EOF
          chmod +x AppDir/AppRun

          uv pip install --system pillow
          python3 -c "
          from PIL import Image, ImageDraw
          img = Image.new('RGBA', (256, 256), (30, 30, 30, 255))
          d = ImageDraw.Draw(img)
          d.ellipse((28, 28, 228, 228), fill=(90, 150, 230, 255))
          d.text((100, 118), 'Y', fill=(255, 255, 255, 255))
          img.save('AppDir/yaas.png')
          "

      - name: Build AppImage
        run: |
          set -e
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run AppDir yaas-x86_64.AppImage

      - name: Upload AppImage as artifact
        uses: actions/upload-artifact@v4
        with:
          name: yaas_installer_linux
          path: yaas-x86_64.AppImage

  release:
    needs: [build-windows, build-macos, build-linux-appimage]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*/*
